<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EnviroTrap Nexus - UIUC Waste Intelligence Platform</title>
<script src="lib/react.js"></script>

<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f8f5ee;color:#1e3a5f;margin:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f0e8d5}
::-webkit-scrollbar-thumb{background:#80a2ce;border-radius:3px}
.demo-banner{background:repeating-linear-gradient(45deg,#e9a825,#e9a825 10px,#f5b820 10px,#f5b820 20px);padding:6px 0;text-align:center;font-size:11px;font-weight:700;color:#78350f;letter-spacing:.08em;text-transform:uppercase}
.nav-item{transition:all .15s;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left;background:none;border:none;cursor:pointer}
.nav-item:hover{background:rgba(255,255,255,.12)}
.nav-item.active{background:rgba(255,255,255,.18);border-left:3px solid #e9a825}
.card{background:white;border-radius:8px;border:1px solid #e4d5b5}
.stat-card{background:white;border-radius:8px;border:1px solid #e4d5b5;padding:1.25rem}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.03em}
.badge-navy{background:#d5e0ef;color:#1e3a5f}
.badge-green{background:#cce5d8;color:#1a3d30}
.badge-amber{background:#fdf0c4;color:#a87214}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-gray{background:#f3f4f6;color:#6b7280}
.badge-purple{background:#ede9fe;color:#5b21b6}
input,select,textarea{border:1px solid #e4d5b5;border-radius:6px;padding:8px 12px;font-size:14px;font-family:inherit;outline:none;width:100%;background:white}
input:focus,select:focus,textarea:focus{border-color:#3b6fae;box-shadow:0 0 0 3px rgba(59,111,174,.1)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#1e3a5f;color:white}.btn-primary:hover:not(:disabled){background:#2d5a8e}
.btn-secondary{background:white;color:#1e3a5f;border:1px solid #abc1df}.btn-secondary:hover:not(:disabled){background:#eef2f8}
.btn-green{background:#2d6a4f;color:white}.btn-green:hover:not(:disabled){background:#235441}
.btn-amber{background:#e9a825;color:white}.btn-amber:hover:not(:disabled){background:#c98f1a}
.btn-danger{background:#dc2626;color:white}.btn-danger:hover:not(:disabled){background:#b91c1c}
.btn-sm{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}
th{background:#f8f5ee;color:#1e3a5f;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;text-align:left;border-bottom:1px solid #e4d5b5}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f0e8d5;color:#374151}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdfcf8}
.progress-bar{background:#e4d5b5;border-radius:9999px;overflow:hidden}
.progress-fill{height:100%;border-radius:9999px;transition:width .5s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:white;border-radius:10px;padding:1.5rem;max-width:620px;width:100%;max-height:90vh;overflow-y:auto}
.section-header{font-size:1.25rem;font-weight:700;color:#1e3a5f;border-bottom:2px solid #e4d5b5;padding-bottom:10px;margin-bottom:1.25rem}
.insight-card{border-left:4px solid #3b6fae}
</style>
</head>
